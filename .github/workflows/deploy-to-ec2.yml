name: Deploy Code to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-06ea3e388448b991c
  APP_DIR: /opt/capitalone_marketing_model_3
  REPO_URL: https://github.com/vineetsinghal2706/capitalone_marketing_model_3.git

jobs:
  validate:
    name: Syntax, Score Regression, and Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: |
          python -m compileall -q jobs scoring airflow tests

      - name: Run unit and smoke tests
        run: |
          python -m pytest -q

  deploy:
    name: Deploy repository to EC2
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS role variable
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is empty or not configured."
            echo "Go to GitHub -> Settings -> Secrets and variables -> Actions -> Variables"
            echo "Create repository variable: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN is configured."

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create SSM deployment parameters file
        run: |
          cat > /tmp/deploy-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "export HOME=/root",
              "if ! command -v git >/dev/null 2>&1; then echo 'Git is not installed on EC2'; exit 1; fi",
              "APP_DIR=/opt/capitalone_marketing_model_3",
              "REPO_URL=https://github.com/vineetsinghal2706/capitalone_marketing_model_3.git",
              "mkdir -p \"$APP_DIR\"",
              "git config --global --add safe.directory \"$APP_DIR\"",
              "if [ -d \"$APP_DIR/.git\" ]; then git -C \"$APP_DIR\" remote set-url origin \"$REPO_URL\"; git -C \"$APP_DIR\" fetch origin main; git -C \"$APP_DIR\" reset --hard origin/main; else CLONE_DIR=\"${APP_DIR}.clone-tmp\"; rm -rf \"$CLONE_DIR\"; git clone --branch main --single-branch \"$REPO_URL\" \"$CLONE_DIR\"; cp -a \"$CLONE_DIR\"/. \"$APP_DIR\"/; rm -rf \"$CLONE_DIR\"; git -C \"$APP_DIR\" reset --hard origin/main; fi",
              "cd \"$APP_DIR\"",
              "echo '===== DISK SPACE BEFORE INSTALL ====='",
              "df -h / /opt /tmp || true",
              "df -i / /opt /tmp || true",
              "rm -rf /root/.cache/pip",
              "mkdir -p /opt/capitalone_marketing_model_3",
              "if [ -d .venv ]; then echo 'Reusing existing virtual environment'; else python3 -m venv .venv; fi",
              "export PIP_NO_CACHE_DIR=1",
              "rm -rf \"$APP_DIR/.pip-tmp\"",
              "export TMPDIR=\"$APP_DIR/.pip-tmp\" TMP=\"$APP_DIR/.pip-tmp\" TEMP=\"$APP_DIR/.pip-tmp\"",
              "mkdir -p \"$TMPDIR\" && chmod 700 \"$TMPDIR\"",
              ".venv/bin/python -m pip install --no-cache-dir --upgrade pip",
              ".venv/bin/pip install --no-cache-dir -r requirements.txt",
              "rm -rf /root/.cache/pip \"$TMPDIR\"",
              "echo '===== DISK SPACE AFTER INSTALL ====='",
              "df -h / /opt /tmp || true",
              "df -i / /opt /tmp || true",
              "mkdir -p /opt/airflow/dags",
              "cp airflow/dags/*.py /opt/airflow/dags/",
              "chmod 644 /opt/airflow/dags/*.py",
              "echo DEPLOYMENT_COMPLETED"
            ]
          }
          JSON

      - name: Deploy code using SSM
        run: |
          DEPLOY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy capitalone_marketing_model_3 to EC2" \
            --parameters file:///tmp/deploy-parameters.json \
            --query "Command.CommandId" \
            --output text \
            --region "$AWS_REGION")

          echo "Deployment command: $DEPLOY_COMMAND_ID"

          # The default AWS CLI waiter polls only 20 times at 5-second intervals.
          # Package installation can take longer, so poll SSM for up to 45 minutes.
          DEPLOY_STATUS="Unknown"
          for attempt in $(seq 1 180); do
            DEPLOY_STATUS=$(aws ssm get-command-invocation \
              --command-id "$DEPLOY_COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region "$AWS_REGION" 2>/dev/null || echo "Pending")
            echo "Deployment status (poll $attempt/180): $DEPLOY_STATUS"

            case "$DEPLOY_STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 15
          done

          echo "===== DEPLOYMENT OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$DEPLOY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" || true

          if [ "$DEPLOY_STATUS" != "Success" ]; then
            echo "::error::EC2 deployment did not finish successfully. Final SSM status: $DEPLOY_STATUS"
            if [ "$DEPLOY_STATUS" = "InProgress" ] || [ "$DEPLOY_STATUS" = "Pending" ] || [ "$DEPLOY_STATUS" = "Delayed" ]; then
              echo "::error::The SSM command may still be running. Check Systems Manager > Run Command using command ID $DEPLOY_COMMAND_ID before retrying."
            fi
            exit 1
          fi

      - name: Create SSM verification parameters file
        run: |
          cat > /tmp/verify-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "export HOME=/root",
              "APP_DIR=/opt/capitalone_marketing_model_3",
              "git config --global --add safe.directory \"$APP_DIR\"",
              "cd \"$APP_DIR\"",
              "test -d .git",
              "echo REMOTE=$(git remote get-url origin)",
              "echo COMMIT=$(git rev-parse --short HEAD)",
              "test -f jobs/snowflake_to_s3.py",
              "test -f jobs/preprocessing.py",
              "test -f jobs/batch_score.py",
              "ls -la jobs",
              "ls -la airflow/dags",
              "test -x .venv/bin/python",
              ".venv/bin/python --version"
            ]
          }
          JSON

      - name: Verify EC2 deployment
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/verify-parameters.json \
            --query "Command.CommandId" \
            --output text \
            --region "$AWS_REGION")

          echo "Verification command: $COMMAND_ID"

          VERIFY_STATUS="Unknown"
          for attempt in $(seq 1 40); do
            VERIFY_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region "$AWS_REGION" 2>/dev/null || echo "Pending")
            echo "Verification status (poll $attempt/40): $VERIFY_STATUS"
            case "$VERIFY_STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 15
          done

          echo "===== VERIFICATION OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" || true

          if [ "$VERIFY_STATUS" != "Success" ]; then
            echo "::error::EC2 verification did not finish successfully. Final SSM status: $VERIFY_STATUS"
            exit 1
          fi

      - name: Deployment completed
        run: |
          echo "Code deployed to EC2 successfully."
          echo "Repository: capitalone_marketing_model_3"
          echo "Docker and ECR are not used by this workflow."
